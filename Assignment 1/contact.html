<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <section>
        <i><h2>Contact Me:-</h2></i><hr><br>

        <form method="get">
          <label for="name">
            Name: <input type="text" name="username" id="name" placeholder="Enter your name" required pattern="[A-Za-z]+">
          </label><br><br>
          <label for="email">
            Email: <input type="email" name="email" id="email" placeholder="Enter your email">
          </label><br><br>
          <label for="message">Message: </label>
          <textarea name=" id=message" placeholder="Enter your message" required></textarea><br><br>
          <button type="send">SEND</button>
          <button type="reset">RESET</button>
            

        </form>
    </section>
    <br>

</body>
